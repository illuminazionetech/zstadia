name: Feature request
description: Suggest an improvement to Z Stadia.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would it make better?
      description: The situation you are in and what is missing today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
