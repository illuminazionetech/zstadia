name: Bug report
description: Something in Z Stadia does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this. Please check [docs/TROUBLESHOOTING.md](https://github.com/illuminazionetech/zstadia/blob/main/docs/TROUBLESHOOTING.md) first: most problems are solved there.
        Before pasting any output, replace your home folder path with `~`.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got instead.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `zstadia doctor`
      render: text
    validations:
      required: true
  - type: dropdown
    id: link
    attributes:
      label: How is the controller connected?
      options:
        - Bluetooth
        - USB cable
        - Both, switching while playing
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version and Mac
      placeholder: macOS 15.3, Apple M2
    validations:
      required: true
  - type: input
    id: game
    attributes:
      label: Game, version and store (if a game is involved)
      placeholder: Cyberpunk 2077 2.3.1, GOG via Heroic
  - type: textarea
    id: log
    attributes:
      label: rumble.log (optional)
      description: Wrap the game with `--log`, reproduce the problem, then paste `.zstadia/<Game>/rumble.log`.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I replaced my home folder path with `~` in everything I pasted.
          required: true
