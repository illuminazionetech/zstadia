# Builds Z Stadia and runs the tests that need no controller, on every pull
# request and on main. Read-only token, pinned actions, no secrets.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Build (arm64 + x86_64)
        run: make

      - name: Check the tool
        run: |
          lipo -archs build/zstadia
          lipo -archs build/ZStadiaRumble.dylib
          ./build/zstadia version
          ./build/zstadia help > /dev/null

      - name: Tests
        run: make test

      - name: Sanitizers (ASan + UBSan, TSan)
        run: make sanitize
